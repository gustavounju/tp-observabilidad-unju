name: CI/CD Observabilidad Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-observability-demo:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout del codigo
      uses: actions/checkout@v4

    - name: 2. Instalar JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 3. Compilar codigo Java
      run: |
        mkdir -p bin
        JAVA_FILES=$(find . -name "*.java" -not -path "./.github/*")
        echo "Archivos Java encontrados:"
        echo "$JAVA_FILES"
        javac -d bin $JAVA_FILES

    - name: 4. Inspeccionar binarios compilados y ejecutar
      env:
        LOKI_URL: "https://logs-prod-024.grafana.net/loki/api/v1/push"
        LOKI_USER: "1825198"
        LOKI_API_KEY: ${{ secrets.LOKI_API_KEY }}
      run: |
        echo "=== Contenido generado en bin ==="
        find bin -name "*.class"

        # Detecta la ruta relativa del archivo class dentro de bin y la convierte en paquete.Clase
        CLASS_PATH=$(find bin -name "ObservabilidadDemo.class" | head -n 1)
        REL_PATH="${CLASS_PATH#bin/}"
        NO_EXT="${REL_PATH%.class}"
        CANONICAL_NAME=$(echo "$NO_EXT" | tr '/' '.')

        echo "Nombre canonico detectado: $CANONICAL_NAME"
        java -cp bin "$CANONICAL_NAME"