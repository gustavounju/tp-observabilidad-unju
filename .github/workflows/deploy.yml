name: CI/CD Observabilidad Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-observability-demo:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Checkout del codigo
      uses: actions/checkout@v4

    - name: 2. Instalar JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 3. Compilar codigo Java con paquete
      run: javac -d bin src/tpobservabilidadjava/ObservabilidadDemo.java

    - name: 4. Ejecutar simulacion y enviar logs a Loki
      env:
        LOKI_URL: "https://logs-prod-024.grafana.net/loki/api/v1/push"
        LOKI_USER: "1825198"
        LOKI_API_KEY: ${{ secrets.LOKI_API_KEY }}
      run: java -cp bin tpobservabilidadjava.ObservabilidadDemo
